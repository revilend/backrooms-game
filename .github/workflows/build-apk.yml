name: Build ZULMAT Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      - 'models/**'
      - 'audio/**'
      - 'video/**'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bundle local 3D models, audio & offline Three.js into www/
        run: |
          mkdir -p www/vendor www/models www/audio www/video
          if [ -d "models" ]; then cp -r models/* www/models/ || true; fi
          if [ -d "audio" ]; then cp -r audio/* www/audio/ || true; fi
          if [ -d "video" ]; then cp -r video/* www/video/ || true; fi
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js -o www/vendor/three.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js -o www/vendor/GLTFLoader.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js -o www/vendor/DRACOLoader.js
          python3 - << 'PYREWRITE'
          p = "www/index.html"
          txt = open(p, "r", encoding="utf-8").read()
          txt = txt.replace("https://cdn.jsdelivr.net/gh/revilend/backrooms-game@main/", "./")
          txt = txt.replace("https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js", "./vendor/three.min.js")
          txt = txt.replace("https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js", "./vendor/GLTFLoader.js")
          txt = txt.replace("https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js", "./vendor/DRACOLoader.js")
          open(p, "w", encoding="utf-8").write(txt)
          print("Rewrite CDN URLs to local offline paths: DONE")
          PYREWRITE
          ls -lh www/vendor

      - name: Install Capacitor & create Android project
        run: |
          npm install
          npx cap add android

      - name: Configure AndroidManifest (Landscape Lock + Mic/Internet for Co-op)
        run: |
          python3 - << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              xml = f.read()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for perm in perms:
              if perm not in xml:
                  xml = xml.replace("<application", perm + "\n    <application", 1)
          if 'android:screenOrientation' not in xml:
              xml = xml.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)
          with open(p, "w", encoding="utf-8") as f:
              f.write(xml)
          PYEOF
          npx cap sync android

      - name: Enable Immersive Fullscreen in MainActivity
        run: |
          python3 - << 'PYEOF'
          import glob

          addon = """  @Override
  public void onStart() {
    super.onStart();
    try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}
  }

  private void applyImmersiveMode() {
    android.view.Window w = getWindow();
    if (w == null) return;
    if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.P) {
      android.view.WindowManager.LayoutParams lp = w.getAttributes();
      lp.layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
      w.setAttributes(lp);
    }
    w.getDecorView().setSystemUiVisibility(
      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
      | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
    );
  }

  @Override
  public void onWindowFocusChanged(boolean hasFocus) {
    super.onWindowFocusChanged(hasFocus);
    if (hasFocus) {
      applyImmersiveMode();
    }
  }
"""

          for jf in glob.glob("android/app/src/main/**/MainActivity.java", recursive=True):
              with open(jf, "r", encoding="utf-8") as f:
                  txt = f.read()
              if "applyImmersiveMode" not in txt:
                  idx = txt.rfind("}")
                  if idx != -1:
                      txt = txt[:idx] + "\n" + addon + "}\n"
                      with open(jf, "w", encoding="utf-8") as f:
                          f.write(txt)
          PYEOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and Upload APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZULMAT-Backrooms-v1.0.apk
          ls -lh ZULMAT-Backrooms-v1.0.apk

      - name: Upload ZULMAT-Backrooms-v1.0.apk
        uses: actions/upload-artifact@v4
        with:
          name: ZULMAT-Backrooms-v1.0-APK
          path: ZULMAT-Backrooms-v1.0.apk
          
