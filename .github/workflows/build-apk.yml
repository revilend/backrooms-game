name: Build ZULMAT Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      - 'models/**'
      - 'audio/**'
      - 'video/**'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bundle local 3D models, audio, video & offline Three.js into www/
        run: |
          mkdir -p www/vendor www/models www/audio www/video
          if [ -d "models" ]; then cp -r models/* www/models/ || true; fi
          if [ -d "audio" ]; then cp -r audio/* www/audio/ || true; fi
          if [ -d "video" ]; then cp -r video/* www/video/ || true; fi
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js -o www/vendor/three.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js -o www/vendor/GLTFLoader.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js -o www/vendor/DRACOLoader.js

      - name: Install Capacitor & create Android project
        run: |
          npm install
          npx cap add android

      - name: Configure AndroidManifest, styles and MainActivity fullscreen
        run: |
          cat << 'EOF' > patch_android.js
          const fs = require('fs');
          const path = require('path');

          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(manifestPath)) {
            let xml = fs.readFileSync(manifestPath, 'utf8');
            const perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace('<application', p + '\n    <application');
              }
            }
            if (!xml.includes('android:screenOrientation')) {
              xml = xml.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"');
            }
            fs.writeFileSync(manifestPath, xml, 'utf8');
          }

          function walk(dir, out = []) {
            if (!fs.existsSync(dir)) return out;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else out.push(full);
            }
            return out;
          }

          for (const sp of walk('android/app/src/main/res').filter(f => f.endsWith('styles.xml'))) {
            let sxml = fs.readFileSync(sp, 'utf8');
            if (!sxml.includes('android:windowFullscreen') && sxml.includes('</style>')) {
              const items = [
                '        <item name="android:windowFullscreen">true</item>',
                '        <item name="android:windowNoTitle">true</item>',
                '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
              ].join('\n') + '\n';
              sxml = sxml.replace('</style>', items + '    </style>');
              fs.writeFileSync(sp, sxml, 'utf8');
            }
          }

          const helper = [
            '',
            '  private void hideSystemBars() {',
            '    android.view.Window w = getWindow();',
            '    if (w == null) return;',
            '    if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.P) {',
            '      android.view.WindowManager.LayoutParams lp = w.getAttributes();',
            '      lp.layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;',
            '      w.setAttributes(lp);',
            '    }',
            '    w.getDecorView().setSystemUiVisibility(',
            '      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY',
            '      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE',
            '      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION',
            '      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN',
            '      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION',
            '      | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN',
            '    );',
            '  }',
            '',
            '  @Override',
            '  public void onWindowFocusChanged(boolean hasFocus) {',
            '    super.onWindowFocusChanged(hasFocus);',
            '    if (hasFocus) {',
            '      hideSystemBars();',
            '    }',
            '  }',
            ''
          ].join('\n');

          for (const jf of walk('android/app/src/main/java').filter(f => f.endsWith('MainActivity.java'))) {
            let src = fs.readFileSync(jf, 'utf8');
            if (!src.includes('hideSystemBars')) {
              if (src.includes('super.onCreate(savedInstanceState);')) {
                src = src.replace('super.onCreate(savedInstanceState);', 'super.onCreate(savedInstanceState);\n    hideSystemBars();');
              }
              const idx = src.lastIndexOf('}');
              if (idx !== -1) {
                src = src.slice(0, idx) + helper + '}\n';
                fs.writeFileSync(jf, src, 'utf8');
              }
            }
          }
          EOF
          node patch_android.js
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and Upload APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZULMAT-Backrooms-v1.0.apk
          ls -lh ZULMAT-Backrooms-v1.0.apk

      - name: Upload ZULMAT-Backrooms-v1.0.apk
        uses: actions/upload-artifact@v4
        with:
          name: ZULMAT-Backrooms-v1.0-APK
          path: ZULMAT-Backrooms-v1.0.apk
          
