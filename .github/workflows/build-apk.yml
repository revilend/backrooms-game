name: Build ZULMAT Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      - 'models/**'
      - 'audio/**'
      - 'video/**'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bundle local 3D models, audio & video into www/
        run: |
          mkdir -p www/vendor www/models www/audio www/video
          if [ -d "models" ]; then cp -r models/* www/models/ || true; fi
          if [ -d "audio" ]; then cp -r audio/* www/audio/ || true; fi
          if [ -d "video" ]; then cp -r video/* www/video/ || true; fi
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js -o www/vendor/three.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js -o www/vendor/GLTFLoader.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js -o www/vendor/DRACOLoader.js
          ls -lh www/vendor

      - name: Install Capacitor & create Android project
        run: |
          npm install
          npx cap add android

      - name: Configure AndroidManifest, Immersive Fullscreen & Landscape Lock
        run: |
          python3 - << 'PYEOF'
          import glob, os

          # 1. AndroidManifest.xml
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              xml = f.read()

          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for perm in perms:
              if perm not in xml:
                  xml = xml.replace("<application", perm + "\n    <application", 1)

          if 'android:screenOrientation' not in xml:
              xml = xml.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)

          with open(p, "w", encoding="utf-8") as f:
              f.write(xml)

          # 2. MainActivity (Java yoki Kotlin) ni topib immersive rejim qo'shish
          java_files = glob.glob("android/app/src/main/**/MainActivity.java", recursive=True)
          kt_files = glob.glob("android/app/src/main/**/MainActivity.kt", recursive=True)

          for jf in java_files:
              with open(jf, "r", encoding="utf-8") as f:
                  src = f.read()
              helper = """
  private void hideSystemBars() {
    android.view.View decorView = getWindow().getDecorView();
    int uiOptions = android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
        | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
        | android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
        | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
        | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
        | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE;
    decorView.setSystemUiVisibility(uiOptions);
  }

  @Override
  public void onWindowFocusChanged(boolean hasFocus) {
    super.onWindowFocusChanged(hasFocus);
    if (hasFocus) {
      hideSystemBars();
    }
  }
"""
              if "hideSystemBars" not in src and "super.onCreate(savedInstanceState);" in src:
                  src = src.replace("super.onCreate(savedInstanceState);", "super.onCreate(savedInstanceState);\n    hideSystemBars();", 1)
                  idx = src.rfind("}")
                  if idx != -1:
                      src = src[:idx] + helper + "\n}\n"
              with open(jf, "w", encoding="utf-8") as f:
                  f.write(src)

          for kf in kt_files:
              with open(kf, "r", encoding="utf-8") as f:
                  src = f.read()
              helper_kt = """
  private fun hideSystemBars() {
    val decorView = window.decorView
    decorView.systemUiVisibility = (
      android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
      or android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
      or android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
    )
  }

  override fun onWindowFocusChanged(hasFocus: Boolean) {
    super.onWindowFocusChanged(hasFocus)
    if (hasFocus) hideSystemBars()
  }
"""
              if "hideSystemBars" not in src and "super.onCreate(savedInstanceState)" in src:
                  src = src.replace("super.onCreate(savedInstanceState)", "super.onCreate(savedInstanceState)\n    hideSystemBars()", 1)
                  idx = src.rfind("}")
                  if idx != -1:
                      src = src[:idx] + helper_kt + "\n}\n"
              with open(kf, "w", encoding="utf-8") as f:
                  f.write(src)
          PYEOF
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and Upload APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZULMAT-Backrooms-v1.0.apk
          ls -lh ZULMAT-Backrooms-v1.0.apk

      - name: Upload ZULMAT-Backrooms-v1.0.apk
        uses: actions/upload-artifact@v4
        with:
          name: ZULMAT-Backrooms-v1.0-APK
          path: ZULMAT-Backrooms-v1.0.apk
          
